[project]
name = "curioslm"
version = "0.1.0"
description = "From-scratch GPT-2 -> Gemma architecture ladder, small language model pretraining"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub>=0.26.0",
    "numpy>=2.5.1",
    "requests>=2.34.2",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
    "tqdm>=4.69.1",
    "transformers>=5.14.1",
    "wandb>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
